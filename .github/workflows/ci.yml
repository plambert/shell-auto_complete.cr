name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    # Bash on every runner, Windows included, where Git for Windows provides
    # it, so the steps are written once.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1

      - name: Install dependencies
        run: shards install

      - name: Check formatting
        run: crystal tool format --check

      # Some specs compile and run small programs with the compiler, so this
      # takes a minute or two.
      - name: Run specs
        run: crystal spec --error-trace
