# Metrics/CyclomaticComplexity - Disallows methods with a cyclomatic complexity higher than `MaxComplexity`
#
# A rule that disallows methods with a cyclomatic complexity higher than `MaxComplexity`
Metrics/CyclomaticComplexity:
  Enabled: true
  MaxComplexity: 20

# Naming/BlockParameterName - Disallows non-descriptive block parameter names
#
# A rule that reports non-descriptive block parameter names.
#
# Favour this:
#
# ```
# tokens.each { |token| token.last_accessed_at = Time.utc }
# ```
#
# Over this:
#
# ```
# tokens.each { |t| t.last_accessed_at = Time.utc }
# ```
Naming/BlockParameterName:
  Enabled: true
  MinNameLength: 3
  AllowNamesEndingInNumbers: true
  AllowedNames: [a, b, ex, io, rs, op, tx, id, ip]
  ForbiddenNames: []
